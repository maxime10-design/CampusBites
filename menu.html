<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Name form</title>
<style>
  :root {
    --bg: #eef2f6;
    --surface: #ffffff;
    --text: #1b2733;
    --muted: #5d6b79;
    --line: #c5d0db;
    --accent: #1f5f8b;
    --accent-text: #ffffff;
    --overlay: rgba(20, 30, 40, 0.5);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111a22;
      --surface: #1b2732;
      --text: #e8eef4;
      --muted: #9aabbb;
      --line: #3a4958;
      --accent: #6db3e0;
      --accent-text: #0e1a24;
      --overlay: rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #111a22;
    --surface: #1b2732;
    --text: #e8eef4;
    --muted: #9aabbb;
    --line: #3a4958;
    --accent: #6db3e0;
    --accent-text: #0e1a24;
    --overlay: rgba(0, 0, 0, 0.6);
  }
  html { color-scheme: light dark; height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  form {
    width: 100%;
    max-width: 22rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.75rem;
  }
  h1 { margin: 0 0 1.25rem; font-size: 1.35rem; }
  label { display: block; margin-bottom: 0.4rem; font-size: 0.95rem; color: var(--muted); }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 0.7rem 0.8rem;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  input:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  button {
    margin-top: 1.25rem;
    width: 100%;
    padding: 0.75rem;
    font: inherit;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  .error { min-height: 1.2rem; margin: 0.4rem 0 0; font-size: 0.85rem; color: #c0392b; }
  dialog {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.5rem;
    max-width: 20rem;
    width: calc(100% - 3rem);
    background: var(--surface);
    color: var(--text);
    text-align: center;
  }
  dialog::backdrop { background: var(--overlay); }
  dialog p { margin: 0 0 1.25rem; font-size: 1.05rem; }
  dialog button { margin-top: 0; }
</style>
</head>
<body>
  <form id="nameForm" novalidate>
    <h1>Enter your name</h1>
    <label for="name">Name</label>
    <input id="name" name="name" type="text" autocomplete="name" maxlength="60" required>
    <p class="error" id="error" role="alert"></p>
    <button type="submit">Submit name</button>
    <a href=""
  </form>

  <dialog id="popup">
    <p id="popupText"></p>
    <button type="button" id="closeBtn">Close</button>
  </dialog>

  <script>
    var form = document.getElementById('nameForm');
    var input = document.getElementById('name');
    var error = document.getElementById('error');
    var popup = document.getElementById('popup');
    var popupText = document.getElementById('popupText');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = input.value.trim();
      if (!name) {
        error.textContent = 'Enter your name to continue.';
        input.focus();
        return;
      }
      error.textContent = '';
      popupText.textContent = 'Thanks, ' + name + ', this is vite default page.';
      popup.showModal();
    });

    document.getElementById('closeBtn').addEventListener('click', function () {
      popup.close();
      form.reset();
      input.focus();
    });
  </script>
</body>
</html>
